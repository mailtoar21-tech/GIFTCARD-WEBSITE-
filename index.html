<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheap Vouchers</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .auth-box {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      place-items: center;
      z-index: 100;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    .auth-card input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .auth-card button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .google-btn {
      background: white;
      border: 1px solid #ddd !important;
    }

    .login-btn {
      background: #171717;
      color: white;
    }

    .signup-btn {
      background: #eef1ff;
      color: #172033;
    }

    .close-btn {
      background: #f2f4f7;
    }

    #authMessage {
      text-align: center;
      margin-top: 12px;
      color: #b42318;
    }

    #userStatus {
      font-size: 13px;
      color: #667085;
    }
  </style>
</head>

<body>

  <div class="logo">Cheap Vouchers</div>
